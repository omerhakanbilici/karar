name: Karar
options:
  bundleIdPrefix: io.github.omerhakanbilici
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "5"
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
targets:
  Karar:
    type: application
    platform: macOS
    sources:
      - path: Karar
        type: syncedFolder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.omerhakanbilici.karar
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        INFOPLIST_KEY_CFBundleDisplayName: Karar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "Karar is Apache-2.0. Includes Ollaya (Apache-2.0)."
    postCompileScripts:
      - name: Embed Ollaya
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          src="$SRCROOT/vendor/ollaya"
          [ -x "$src/bin/ollaya" ] && [ -f "$src/lib/ollaya/mlx_metal/mlx.metallib" ] \
            || { echo "error: run scripts/fetch-ollaya.sh first"; exit 1; }
          install -m 755 "$src/bin/ollaya" "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/ollaya"
          codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" --options runtime --identifier io.github.omerhakanbilici.karar.ollaya "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/ollaya"
          res="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          # MLX's Metal kernels (the Apple GPU): the runner looks in <exe dir>/../Resources/mlx_metal/.
          mkdir -p "$res/mlx_metal" "$res/Ollaya"
          cp "$src/lib/ollaya/mlx_metal/mlx.metallib" "$res/mlx_metal/"
          # Named files, not a glob: share/doc/ollaya/ also holds directories, and llama.cpp's
          # notices stay out with llama.cpp itself (not embedded).
          for f in LICENSE THIRD_PARTY_NOTICES onnxruntime-ThirdPartyNotices.txt; do
            cp "$src/share/doc/ollaya/$f" "$res/Ollaya/"
          done
          cp "$src/share/doc/ollaya/mlx_metal/THIRD_PARTY_NOTICES" "$res/Ollaya/mlx-THIRD_PARTY_NOTICES"
          cp "$src/VERSION" "$res/Ollaya/VERSION"
          cp "$SRCROOT/LICENSE" "$SRCROOT/NOTICE" "$res/"
  KararTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: KararTests
        type: syncedFolder
    dependencies:
      - target: Karar
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  KararUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: KararUITests
        type: syncedFolder
    dependencies:
      - target: Karar
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # Never shipped. With Hardened Runtime the XCTest runner's library validation refuses the
        # ad-hoc signed test bundle ("different Team IDs").
        ENABLE_HARDENED_RUNTIME: NO
    # Xcode copies these onto the sandboxed KararUITests-Runner; the port test's stand-in server
    # (a child of the runner) needs to listen on 11435.
    entitlements:
      path: KararUITests.entitlements
      properties:
        com.apple.security.network.server: true
schemes:
  # Unit tests only: what CI runs (release.yml).
  Karar:
    build:
      targets:
        Karar: all
        KararTests: [test]
    test:
      config: Debug
      targets:
        - KararTests
  # Local only: drives the real app with the mouse and keyboard (needs Automation mode).
  KararUITests:
    build:
      targets:
        Karar: all
        KararUITests: [test]
    test:
      config: Debug
      targets:
        - KararUITests
