name: Karar
options:
  bundleIdPrefix: io.github.omerhakanbilici
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.2"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
targets:
  Karar:
    type: application
    platform: macOS
    sources:
      - path: Karar
        type: syncedFolder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.omerhakanbilici.karar
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        INFOPLIST_KEY_CFBundleDisplayName: Karar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "Karar is Apache-2.0. Includes Ollaya (Apache-2.0)."
    postCompileScripts:
      - name: Embed Ollaya
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          src="$SRCROOT/vendor/ollaya"
          [ -x "$src/bin/ollaya" ] || { echo "error: run scripts/fetch-ollaya.sh first"; exit 1; }
          install -m 755 "$src/bin/ollaya" "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/ollaya"
          codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" --options runtime --identifier io.github.omerhakanbilici.karar.ollaya "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/ollaya"
          mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Ollaya"
          cp "$src/share/doc/ollaya/"* "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Ollaya/"
          cp "$src/VERSION" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Ollaya/VERSION"
          cp "$SRCROOT/LICENSE" "$SRCROOT/NOTICE" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/"
  KararTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: KararTests
        type: syncedFolder
    dependencies:
      - target: Karar
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  KararUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: KararUITests
        type: syncedFolder
    dependencies:
      - target: Karar
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # Never shipped. With Hardened Runtime the XCTest runner's library validation refuses the
        # ad-hoc signed test bundle ("different Team IDs").
        ENABLE_HARDENED_RUNTIME: NO
    # Xcode copies these onto the sandboxed KararUITests-Runner; the port test's stand-in server
    # (a child of the runner) needs to listen on 11435.
    entitlements:
      path: KararUITests.entitlements
      properties:
        com.apple.security.network.server: true
schemes:
  # Unit tests only: what CI runs (release.yml).
  Karar:
    build:
      targets:
        Karar: all
        KararTests: [test]
    test:
      config: Debug
      targets:
        - KararTests
  # Local only: drives the real app with the mouse and keyboard (needs Automation mode).
  KararUITests:
    build:
      targets:
        Karar: all
        KararUITests: [test]
    test:
      config: Debug
      targets:
        - KararUITests
